services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: educatech
      POSTGRES_PASSWORD: educatech
      POSTGRES_DB: educatech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://educatech:educatech@db:5432/educatech
      JWT_SECRET: ${JWT_SECRET:-educatech-dev-jwt-secret}
      JWT_EXPIRES_IN: 8h
      AUTH_EMAIL: ${AUTH_EMAIL:-professor@educatech.com}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-educatech123}
      AUTH_NAME: ${AUTH_NAME:-Prof. Amanda Abila Melo}
    depends_on:
      - db

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  test:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci && npm test"
    environment:
      DATABASE_URL: postgres://educatech:educatech@db:5432/educatech
      JWT_SECRET: educatech-dev-jwt-secret
      AUTH_EMAIL: professor@educatech.com
      AUTH_PASSWORD: educatech123
    depends_on:
      - db
    profiles:
      - test

volumes:
  postgres_data:
